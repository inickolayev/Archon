worktree:
  # ChessWin fork: our engine branch, not upstream's `dev`. Upstream ships `dev` here and for
  # them that is right; for us it means every run against this repository in the Factory cuts
  # its worktree from UPSTREAM's branch instead of the engine we actually run — including the
  # nightly catch-up's own repair, which then merges upstream into upstream and proves nothing.
  # Found 2026-10-02, when the repair was first exercised for real.
  baseBranch: chesswin
  # `git worktree add` carries tracked files only, so every gitignored runtime file is
  # absent from a fresh worktree. Agents work inside worktrees, so without this they
  # cannot start the server, run integration tests, or reproduce anything that reads
  # local credentials. A contributor with no `.env` is unaffected: a missing source is
  # skipped silently (worktree-copy.ts).
  copyFiles:
    - .env

docs:
  path: packages/docs-web/src/content/docs

aliases:
  # Cheap model for the t1–t4 engine-primitive test workflows. Every test workflow
  # references `@mini` rather than a literal model id, so retargeting them all is a
  # one-line edit here — and so per-run tier/alias rebinding (#2481) can reach them.
  '@mini':
    provider: pi
    model: minimax/MiniMax-M3
