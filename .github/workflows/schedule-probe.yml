# ВРЕМЕННЫЙ ПРОБНИК. Проверяет одно: стреляет ли в этом репозитории `schedule:` вообще.
#
# Зачем: ни один наш воркфлоу по расписанию ни разу не запустился сам (ночь 28.09 —
# ни догонялка форка, ни раскат фабрики), при том что тот же воркфлоу вручную идёт зелёным.
# Пока непонятно, дело в наших файлах или в расписании как таком, — этот пробник отвечает
# на второй вопрос, ничего не делая и ничего не трогая.
#
# УДАЛИТЬ сразу после ответа. Если ты это читаешь и ответ уже известен — удаляй.
name: schedule-probe

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - run: echo "tick ${{ github.event_name }} $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
