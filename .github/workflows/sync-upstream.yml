# Keeps this fork current with upstream coleam00/Archon.
#
# Daily it fast-forwards `main` (a pure mirror of upstream) and reports how far
# our engine branch `chesswin` has fallen behind. It never touches `chesswin`:
# the ChessWin Factory verifies its pinned Archon tree byte for byte, so moving
# the engine is always a deliberate rebase + repin (see bin/repin-archon there).
name: sync-upstream

on:
  schedule:
    - cron: '17 3 * * *' # 06:17 MSK daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward main from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main \
            --jq '"main: \(.merge_type) — \(.message)"' | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Report how far the engine branch is behind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/compare/chesswin...main" \
            --jq '"chesswin is \(.behind_by) commit(s) behind main, \(.ahead_by) ahead (our patches)."' \
            | tee -a "${GITHUB_STEP_SUMMARY}"
